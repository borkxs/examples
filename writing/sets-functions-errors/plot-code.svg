<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript plot function code</title>
  <desc id="desc">A JavaScript function named plot checks that x is finite, then returns a piecewise value.</desc>
  <defs>
    <style>
      .bg { fill: #1f1f1f; }
      .num { fill: #858585; }
      .kw { fill: #c586c0; }
      .decl { fill: #569cd6; }
      .fn { fill: #dcdcaa; }
      .obj { fill: #4ec9b0; }
      .str { fill: #ce9178; }
      .op { fill: #d4d4d4; }
      .id { fill: #9cdcfe; }
      text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 24px; }
    </style>
  </defs>

  <rect class="bg" width="760" height="320" rx="18"/>
  <g transform="translate(24 42)">
    <g text-anchor="end" class="num">
      <text x="22" y="0">1</text>
      <text x="22" y="38">2</text>
      <text x="22" y="76">3</text>
      <text x="22" y="114">4</text>
      <text x="22" y="152">5</text>
      <text x="22" y="190">6</text>
      <text x="22" y="228">7</text>
    </g>

    <g transform="translate(60 0)">
      <line x1="0" y1="10" x2="0" y2="238" stroke="#3a3a3a"/>
      <text x="0" y="0"><tspan class="decl">const</tspan><tspan class="op"> </tspan><tspan class="fn">plot</tspan><tspan class="op"> = (</tspan><tspan class="id">x</tspan><tspan class="op">) =&gt; {</tspan></text>
      <text x="28" y="38"><tspan class="kw">if</tspan><tspan class="op"> (!</tspan><tspan class="obj">Number</tspan><tspan class="op">.</tspan><tspan class="fn">isFinite</tspan><tspan class="op">(</tspan><tspan class="id">x</tspan><tspan class="op">)) </tspan><tspan class="kw">throw</tspan><tspan class="op"> </tspan><tspan class="decl">new</tspan><tspan class="op"> </tspan><tspan class="obj">Error</tspan><tspan class="op">(</tspan><tspan class="str">'wat'</tspan><tspan class="op">);</tspan></text>
      <text x="28" y="76"></text>
      <text x="28" y="114"><tspan class="kw">if</tspan><tspan class="op"> (</tspan><tspan class="id">x</tspan><tspan class="op"> &lt; -200) </tspan><tspan class="kw">return</tspan><tspan class="op"> 100 * </tspan><tspan class="obj">Math</tspan><tspan class="op">.</tspan><tspan class="fn">random</tspan><tspan class="op">() + 10;</tspan></text>
      <text x="28" y="152"><tspan class="kw">else if</tspan><tspan class="op"> (</tspan><tspan class="id">x</tspan><tspan class="op"> &lt; 200) </tspan><tspan class="kw">return</tspan><tspan class="op"> </tspan><tspan class="obj">Math</tspan><tspan class="op">.</tspan><tspan class="fn">abs</tspan><tspan class="op">(</tspan><tspan class="id">x</tspan><tspan class="op">);</tspan></text>
      <text x="28" y="190"><tspan class="kw">else</tspan><tspan class="op"> </tspan><tspan class="kw">return</tspan><tspan class="op"> 100 * </tspan><tspan class="obj">Math</tspan><tspan class="op">.</tspan><tspan class="fn">sin</tspan><tspan class="op">(</tspan><tspan class="id">x</tspan><tspan class="op"> / 4) + 100;</tspan></text>
      <text x="0" y="228"><tspan class="op">}</tspan></text>
    </g>
  </g>
</svg>
