<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Piecewise plot</title>
  <desc id="desc">A graph showing random-looking values from x equals -500 to -200, an absolute-value V from -200 to 200, and a sine wave from 200 to 500.</desc>
