    </clipPath>
    <style>
      .axis { stroke: #111; stroke-width: 1.5; }
      .tick { stroke: #111; stroke-width: 1.2; }
      .label { fill: #111; font-family: Arial, sans-serif; font-size: 13px; }
      .line { fill: none; stroke: #2682cf; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="960" height="540" fill="#fff"/>

  <g>
