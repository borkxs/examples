<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Chart clipping layers</title>
  <desc id="desc">A layered chart where a dashed blue background line is clipped to the shape of a foreground area dataset.</desc>
  <defs>
    <clipPath id="foreground-area-clip">
      <path d="M 105 390 L 105 315 C 170 275, 235 235, 300 250 C 365 265, 425 175, 495 165 C 565 155, 615 240, 680 225 C 745 210, 805 135, 855 100 L 855 390 Z"/>
    </clipPath>
    <linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f80ed" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2f80ed" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="label-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#10233f" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <rect x="70" y="50" width="820" height="390" rx="18" fill="#f8fbff" stroke="#dce5f2"/>

  <g stroke="#d7e1ee" stroke-width="1">
    <line x1="105" y1="100" x2="855" y2="100"/>
    <line x1="105" y1="170" x2="855" y2="170"/>
    <line x1="105" y1="240" x2="855" y2="240"/>
    <line x1="105" y1="310" x2="855" y2="310"/>
    <line x1="105" y1="390" x2="855" y2="390"/>
    <line x1="105" y1="100" x2="105" y2="390"/>
    <line x1="255" y1="100" x2="255" y2="390"/>
    <line x1="405" y1="100" x2="405" y2="390"/>
    <line x1="555" y1="100" x2="555" y2="390"/>
    <line x1="705" y1="100" x2="705" y2="390"/>
    <line x1="855" y1="100" x2="855" y2="390"/>
  </g>

  <path d="M 105 390 L 105 315 C 170 275, 235 235, 300 250 C 365 265, 425 175, 495 165 C 565 155, 615 240, 680 225 C 745 210, 805 135, 855 100 L 855 390 Z" fill="url(#area-fill)" stroke="#2f80ed" stroke-width="4"/>

  <path d="M 105 335 C 190 185, 285 360, 370 220 C 455 80, 530 350, 620 205 C 710 60, 785 290, 855 130" fill="none" stroke="#2f80ed" stroke-width="9" stroke-dasharray="18 16" stroke-linecap="round" opacity="0.15"/>

  <g clip-path="url(#foreground-area-clip)">
    <path d="M 105 335 C 190 185, 285 360, 370 220 C 455 80, 530 350, 620 205 C 710 60, 785 290, 855 130" fill="none" stroke="#2f80ed" stroke-width="9" stroke-dasharray="18 16" stroke-linecap="round" opacity="0.62"/>
  </g>

  <path d="M 105 315 C 170 275, 235 235, 300 250 C 365 265, 425 175, 495 165 C 565 155, 615 240, 680 225 C 745 210, 805 135, 855 100" fill="none" stroke="#174ea6" stroke-width="4"/>

  <g font-family="Arial, sans-serif" fill="#172033">
    <g filter="url(#label-shadow)">
      <rect x="118" y="68" width="255" height="58" rx="12" fill="#fff"/>
      <text x="140" y="103" font-size="19" font-weight="700">Foreground area defines the mask</text>
    </g>
    <line x1="372" y1="116" x2="455" y2="160" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#label-shadow)">
      <rect x="555" y="355" width="285" height="58" rx="12" fill="#fff"/>
      <text x="577" y="390" font-size="19" font-weight="700">Dashed line is clipped to that shape</text>
    </g>
    <line x1="640" y1="355" x2="625" y2="245" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
